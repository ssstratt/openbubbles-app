name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Fairplay keys
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "rustpush/certs/fairplay"
          $cert_names = @(
            "4056631661436364584235346952193", "4056631661436364584235346952194",
            "4056631661436364584235346952195", "4056631661436364584235346952196",
            "4056631661436364584235346952197", "4056631661436364584235346952198",
            "4056631661436364584235346952199", "4056631661436364584235346952200",
            "4056631661436364584235346952201", "4056631661436364584235346952208"
          )
          foreach ($name in $cert_names) {
            Copy-Item "rustpush/certs/legacy-fairplay/fairplay.pem" "rustpush/certs/fairplay/$name.pem"
            Copy-Item "rustpush/certs/legacy-fairplay/fairplay.crt" "rustpush/certs/fairplay/$name.crt"
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-windows-x64
          path: build/windows/x64/runner/Release/
